name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── TypeScript typecheck ───────────────────────────────────────────────────
  typecheck:
    name: TypeCheck (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck web app
        run: npm run typecheck --workspace=apps/web

  typecheck-mobile:
    name: TypeCheck (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck mobile app
        run: npm run typecheck --workspace=apps/mobile

  # ── Unit tests ────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-artifacts
          path: test-results/unit-artifacts/
          retention-days: 7

  # ── Integration tests (local Supabase stack) ───────────────────────────────
  # audit2.md P1-1. Esta suite es la única razón por la que se puede afirmar que
  # el agujero de escritura RLS de audit.md P0-1 (y el de audit2.md P0-1) sigue
  # cerrado: reproduce los ataques con un JWT de usuario real contra PostgREST.
  # Hasta ahora dependía de que alguien se acordara de levantar el stack local y
  # correrla a mano — así que una migración futura podía reabrir el agujero con
  # CI en verde. Es exactamente el mecanismo que dejó pasar los dos hallazgos.
  #
  # Levanta el stack completo de Supabase en el runner (Docker viene incluido en
  # ubuntu-latest) y replaya TODAS las migraciones desde cero, que además es lo
  # único que destapa migraciones no reproducibles (ver "Entorno de desarrollo
  # local" en CLAUDE.md: así aparecieron los bugs de 006, 035 y 049–051).
  #
  # LÍMITE CONOCIDO: los casos que hablan por HTTP con la app (paquetes,
  # eventos, /api/chat/list, responder invitación de ensayo) se SALTAN acá,
  # porque levantar `dev:web` exigiría los secretos de Mercado Pago/Cloudinary.
  # Se ven en el resumen como "skipped", no como verdes. Todo lo que toca RLS
  # —incluida rls-guards.spec.ts completa— sí corre.
  test-integration:
    name: Integration Tests (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase (applies every migration from scratch)
        run: npx supabase start

      # Las suites leen SOLO este archivo (gitignored, cada una define por su
      # cuenta lo demás que necesita, como QR_TOKEN_SECRET). Los valores salen
      # del stack recién levantado, sin comillas: tres de los specs hacen
      # `.trim()` sin quitarlas.
      - name: Point the suite at the local stack
        run: |
          eval "$(npx supabase status -o env)"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' \
            "$API_URL" "$ANON_KEY" "$SERVICE_ROLE_KEY" > apps/web/.env.development.local

      - name: Run integration tests
        run: npm run test:integration

      - name: Supabase logs on failure
        if: failure()
        run: docker ps -a && npx supabase status || true

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-artifacts
          path: test-results/integration-artifacts/
          retention-days: 7

  # ── Smoke tests (production, read-only) ───────────────────────────────────
  # These run against the production URL and require no local server.
  # They are skipped if prod credentials are not configured.
  smoke-prod:
    name: Smoke Tests (production)
    runs-on: ubuntu-latest
    # Only run when secrets are available (skipped on forks / missing secrets)
    if: ${{ vars.RUN_SMOKE_TESTS == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests (production)
        env:
          BASE_URL: ${{ vars.PROD_BASE_URL || 'https://dc-project-web.vercel.app' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: npm run test:e2e:prod

      - name: Upload smoke test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: playwright-report-prod/
          retention-days: 7
